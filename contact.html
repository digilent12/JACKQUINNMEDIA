<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - JackQuinnMedia</title>
  <meta name="description" content="Get in touch with JackQuinnMedia for concert and live music photography.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">JackQuinnMedia</a>
    <nav>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="contact-page">
    <section class="contact-hero">
      <h1>Send us a message</h1>
      <div class="contact-details">
        <p>EMAIL: <a href="mailto:jackquinnmedia@gmail.com">jackquinnmedia@gmail.com</a></p>
        <p>TEL: <a href="tel:+14235037277">423-503-7277</a></p>
      </div>
    </section>

    <section class="contact-form-section">
      <form class="contact-form" id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">Email address <span class="required">*</span></label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="message">Message <span class="required">*</span></label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn-outline">Send Message</button>
        <p class="form-status" id="form-status" hidden></p>
      </form>
    </section>

    
  </main>

  <script src="js/main.js"></script>
</body>
</html>
