<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JackQuinnMedia</title>
  <meta name="description" content="JackQuinnMedia — Concert and live music photography. Every great shot starts with a conversation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">JackQuinnMedia</a>
    <nav>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Featured photograph">
      
      <img
        src="images/hero2.jpg"
        alt="Live performance photography by JackQuinnMedia"
        width="1500"
        height="100"
        fetchpriority="high"
      >
      
      <div class="hero-content">
       
        <h1>Live Music Visuals</h1>
        <h2>Concert Photography & Videography | Nashville, TN</h2>
        <a href="#gallery-grid" class="scroll-btn">View Gallery</a>
      </div>
      
      

    </section>

    <section class="gallery" aria-label="Portfolio gallery">
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <section class="cta" id="contact">
      <h1>Get in touch</h1>
      <p class="cta-subtitle">Every great shot starts with a conversation — reach out and let's turn your vision into something unforgettable</p>
      <a href="contact.html" class="btn-outline">Let's Connect</a>
      <a href="https://www.instagram.com/jackquinnmedia/" class="instagram-link"><img src="icons/instagram.svg" alt="Instagram" width="30" height="30"></a>
    </section>

   
  </main>


  <script src="js/main.js"></script>
</body>
</html>
